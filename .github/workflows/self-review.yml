name: GSR Self-Review

# Dogfoods the GSR action on its own PRs: runs both the swarm ("subagent")
# and single-pass ("basic") review modes against this repo's own diffs,
# posting inline findings as PR review comments. Purely additive/advisory —
# fail-on-severity is "none" so it never blocks the deploy.yml test gate;
# CodeRabbit and gemini-code-assist remain the automated backstop, and
# /quick-review or /code-review is still the human-triggered pre-merge gate.
#
# Requires a repository secret GEMINI_API_KEY (same one used by the deployed
# apps). Runs on pull_request (not pull_request_target), so it only has
# access to that secret for PRs opened from this repo, not forks.
#
# usage-report-url/usage-report-key opt this repo into GSR's own centralized
# usage reporting (dogfooding the feature added in PR #58) using the
# USAGE_REPORT_KEY repo secret, matching the same distribution model as
# GEMINI_API_KEY above. Every run also always writes its own usage summary
# to this workflow run's Job Summary regardless of these two inputs.
#
# feedback-loop: observe turns on Stage 1-2 classification of replies to
# prior findings (pr-comment-feedback-loop-design.md) without posting
# anything — no `feedback-post`, so it's purely additive/observational,
# same posture as the swarm/basic reviews above. feedback-report-url/
# feedback-report-key mirror usage-report-url/usage-report-key's opt-in
# shape exactly, reporting classification outcomes to the same
# FEEDBACK_SHARED_SECRET already live in production from PR #63, via the
# GSR_FEEDBACK_KEY repo secret.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: gsr-self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  self-review-swarm:
    name: GSR self-review (swarm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          mode: subagent
          fail-on-severity: none
          usage-report-url: https://gsr-code-review.fly.dev/api/usage/ingest
          usage-report-key: ${{ secrets.USAGE_REPORT_KEY }}
          feedback-loop: observe
          feedback-report-url: https://gsr-code-review.fly.dev/api/findings/feedback
          feedback-report-key: ${{ secrets.GSR_FEEDBACK_KEY }}

  self-review-basic:
    name: GSR self-review (basic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          mode: basic
          fail-on-severity: none
          usage-report-url: https://gsr-code-review.fly.dev/api/usage/ingest
          usage-report-key: ${{ secrets.USAGE_REPORT_KEY }}
          feedback-loop: observe
          feedback-report-url: https://gsr-code-review.fly.dev/api/findings/feedback
          feedback-report-key: ${{ secrets.GSR_FEEDBACK_KEY }}
