name: 'GSR Code Review'
description: 'Multi-agent Gemini-powered code review that posts inline findings on a pull request.'
author: 'weitzer-org'
branding:
  icon: 'search'
  color: 'blue'

inputs:
  gemini-api-key:
    description: 'Gemini API key used to run the review. Store as a repo/org secret.'
    required: true
  github-token:
    description: 'Token used to read the PR diff and post review comments.'
    required: false
    default: ${{ github.token }}
  mode:
    description: >
      Review strategy: "subagent" runs the full swarm of specialized agents
      (Architecture, Logic, Security, TechDebt, Testing, ...) plus a
      deduplication pass and finds more issues but costs more tokens/time.
      "basic" runs a single general-purpose review pass, faster and cheaper.
    required: false
    default: 'subagent'
  fail-on-severity:
    description: >
      Fail the workflow if a finding at or above this severity is reported:
      one of "critical", "high", "medium", "low", or "none" to never fail.
    required: false
    default: 'none'
  gemini-model:
    description: 'Override the Gemini model used for review.'
    required: false
    default: ''
  max-review-files:
    description: 'Maximum number of changed files to review before truncating.'
    required: false
    default: '300'
  low-priority-paths:
    description: >
      OPTIONAL. Comma-separated globs (e.g. "docs/mockups/**,scratch/*.py")
      for paths that are reference material or scratch tooling rather than
      shipping code. Findings on a matching path are capped at MEDIUM
      severity instead of CRITICAL/HIGH — dampened, never excluded, since
      these files can still contain real (just low-stakes) issues. This
      EXTENDS the built-in defaults (design_prd/**, **/*.mockup.html,
      root-level *.sh scripts) — it can only add patterns, not remove the
      defaults. See review-quality-design.md §4.1.
    required: false
    default: ''
  agents:
    description: >
      Comma-separated list of subagent IDs to run (e.g. "logic,security"),
      or "all" to run every agent. Only applies when mode is "subagent";
      ignored (with a warning) when mode is "basic". Defaults to "all".
    required: false
    default: 'all'
  usage-report-url:
    description: >
      OPTIONAL, off by default. URL of a hosted GSR usage-ingest endpoint
      (POST /api/usage/ingest) to additionally report this run's Gemini
      usage (call counts, tokens, cost, latency — never diff or PR content)
      to. Only set this if the GSR maintainer has explicitly given your repo
      this value and usage-report-key. See ACTION.md's "Usage reporting"
      section. A local usage summary is always written to this run's Job
      Summary regardless of this setting.
    required: false
    default: ''
  usage-report-key:
    description: >
      OPTIONAL. Shared secret paired with usage-report-url, provided by the
      GSR maintainer alongside it. Store as a repo secret. Has no effect
      unless usage-report-url is also set.
    required: false
    default: ''
  feedback-loop:
    description: >
      OPTIONAL, off by default — even "observe" spends your own Gemini
      quota. Reads reply threads on findings GSR previously posted and
      classifies each reply's stance (accepted/rejected/question/neutral).
      One of "off" (default), "observe" (classify and report to this run's
      Job Summary; posts nothing to GitHub), or "respond" (additionally
      adjudicates rejected replies and reports what it would post — see
      "PR comment feedback loop" in ACTION.md). "respond" alone still
      posts nothing to GitHub — it's a dry-run preview; set feedback-post
      to "true" as well to actually post rebuttals. No new permissions or
      secrets are required for either value (feedback-post reuses the
      pull-requests: write permission already granted for posting
      findings).
    required: false
    default: 'off'
  feedback-max-replies:
    description: >
      OPTIONAL. Only relevant when feedback-loop is "respond". Caps how
      many rebuttal decisions the feedback loop reports as "would post" per
      run (design doc §7.2, §8.4). Shapes the dry-run preview whether or
      not feedback-post is enabled, and additionally caps real posts once
      feedback-post is "true".
    required: false
    default: '3'
  feedback-min-confidence:
    description: >
      OPTIONAL. Only relevant when feedback-loop is "respond". Minimum
      adjudicator confidence (0-1) required before a rejected finding's
      pushback is reported as "would post" (and, once feedback-post is
      "true", actually posted). Same scope as feedback-max-replies.
    required: false
    default: '0.7'
  feedback-post:
    description: >
      OPTIONAL, default "false". Only takes effect when feedback-loop is
      "respond" — has no effect otherwise (a warning is logged if set true
      without it). This is Phase 2b's arm switch: when "true", rejections
      the adjudicator says still stand (verdict pushback_incorrect,
      confidence >= feedback-min-confidence) are actually posted as a reply
      in that GitHub thread, capped at feedback-max-replies per run, once
      per finding ever. When "false" (the default), feedback-loop: respond
      continues to run exactly as before — adjudicating and reporting a
      dry-run preview, posting nothing. Deliberately a SEPARATE input from
      feedback-loop, so a consumer already relying on the "respond"
      dry-run preview is never silently upgraded to real posting by e.g. a
      default change. Not to be confused with feedback-report-url /
      feedback-report-key (a separate stage that reports feedback DATA to a
      hosted GSR endpoint) — this posts a REPLY
      COMMENT directly to the PR thread itself, under this Action's own
      GITHUB_TOKEN identity. See "PR comment feedback loop" in ACTION.md,
      including its fork-PR and concurrency-group guidance before enabling.
    required: false
    default: 'false'
  feedback-report-url:
    description: >
      OPTIONAL, off by default. URL of a hosted GSR finding-feedback
      endpoint (POST /api/findings/feedback) to additionally report this
      run's feedback-loop outcomes (accepted/rejected/adjudicated verdicts
      per finding — never diff or PR content) to. Only set this if the GSR
      maintainer has explicitly given your repo this value and
      feedback-report-key. Mirrors usage-report-url's opt-in shape exactly.
      Has no effect unless feedback-loop is "observe" or "respond" (a run
      with no classified replies reports nothing regardless).
    required: false
    default: ''
  feedback-report-key:
    description: >
      OPTIONAL. Shared secret paired with feedback-report-url, provided by
      the GSR maintainer alongside it — the same value the hosted endpoint
      validates as FEEDBACK_SHARED_SECRET. Store as a repo secret. Has no
      effect unless feedback-report-url is also set.
    required: false
    default: ''

runs:
  using: 'docker'
  image: 'action.Dockerfile'
  env:
    GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    REVIEW_MODE: ${{ inputs.mode }}
    FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
    GEMINI_MODEL: ${{ inputs.gemini-model }}
    MAX_REVIEW_FILES: ${{ inputs.max-review-files }}
    LOW_PRIORITY_PATHS: ${{ inputs.low-priority-paths }}
    REVIEW_AGENTS: ${{ inputs.agents }}
    USAGE_INGEST_URL: ${{ inputs.usage-report-url }}
    USAGE_INGEST_SHARED_SECRET: ${{ inputs.usage-report-key }}
    FEEDBACK_LOOP_MODE: ${{ inputs.feedback-loop }}
    FEEDBACK_MAX_REPLIES: ${{ inputs.feedback-max-replies }}
    FEEDBACK_MIN_CONFIDENCE: ${{ inputs.feedback-min-confidence }}
    FEEDBACK_POST: ${{ inputs.feedback-post }}
    FEEDBACK_REPORT_URL: ${{ inputs.feedback-report-url }}
    FEEDBACK_SHARED_SECRET: ${{ inputs.feedback-report-key }}
