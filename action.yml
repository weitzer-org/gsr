name: 'GSR Code Review'
description: 'Multi-agent Gemini-powered code review that posts inline findings on a pull request.'
author: 'weitzer-org'
branding:
  icon: 'search'
  color: 'blue'

inputs:
  gemini-api-key:
    description: 'Gemini API key used to run the review. Store as a repo/org secret.'
    required: true
  github-token:
    description: 'Token used to read the PR diff and post review comments.'
    required: false
    default: ${{ github.token }}
  mode:
    description: >
      Review strategy: "subagent" runs the full swarm of specialized agents
      (Architecture, Logic, Security, TechDebt, Testing, ...) plus a
      deduplication pass and finds more issues but costs more tokens/time.
      "basic" runs a single general-purpose review pass, faster and cheaper.
    required: false
    default: 'subagent'
  fail-on-severity:
    description: >
      Fail the workflow if a finding at or above this severity is reported:
      one of "critical", "high", "medium", "low", or "none" to never fail.
    required: false
    default: 'none'
  gemini-model:
    description: 'Override the Gemini model used for review.'
    required: false
    default: ''
  max-review-files:
    description: 'Maximum number of changed files to review before truncating.'
    required: false
    default: '300'
  agents:
    description: >
      Comma-separated list of subagent IDs to run (e.g. "logic,security"),
      or "all" to run every agent. Only applies when mode is "subagent";
      ignored (with a warning) when mode is "basic". Defaults to "all".
    required: false
    default: 'all'
  usage-report-url:
    description: >
      OPTIONAL, off by default. URL of a hosted GSR usage-ingest endpoint
      (POST /api/usage/ingest) to additionally report this run's Gemini
      usage (call counts, tokens, cost, latency — never diff or PR content)
      to. Only set this if the GSR maintainer has explicitly given your repo
      this value and usage-report-key. See ACTION.md's "Usage reporting"
      section. A local usage summary is always written to this run's Job
      Summary regardless of this setting.
    required: false
    default: ''
  usage-report-key:
    description: >
      OPTIONAL. Shared secret paired with usage-report-url, provided by the
      GSR maintainer alongside it. Store as a repo secret. Has no effect
      unless usage-report-url is also set.
    required: false
    default: ''
  feedback-loop:
    description: >
      OPTIONAL, off by default — even "observe" spends your own Gemini
      quota. Reads reply threads on findings GSR previously posted and
      classifies each reply's stance (accepted/rejected/question/neutral).
      One of "off" (default), "observe" (classify and report to this run's
      Job Summary; posts nothing to GitHub), or "respond" (additionally
      adjudicates rejected replies and reports what it would post — see
      "PR comment feedback loop" in ACTION.md; posting itself is not yet
      enabled in this release, so "respond" still posts nothing to GitHub).
      No new permissions or secrets are required for either value.
    required: false
    default: 'off'
  feedback-max-replies:
    description: >
      OPTIONAL. Only relevant when feedback-loop is "respond". Caps how
      many rebuttal decisions the feedback loop reports as "would post" per
      run (design doc §7.2, §8.4). Has no effect while posting itself is
      disabled (see feedback-loop above), but shapes the dry-run preview
      today and will cap real posts once posting is enabled.
    required: false
    default: '3'
  feedback-min-confidence:
    description: >
      OPTIONAL. Only relevant when feedback-loop is "respond". Minimum
      adjudicator confidence (0-1) required before a rejected finding's
      pushback is reported as "would post". Same caveat as
      feedback-max-replies — shapes the dry-run preview only until posting
      is enabled.
    required: false
    default: '0.7'

runs:
  using: 'docker'
  image: 'action.Dockerfile'
  env:
    GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    REVIEW_MODE: ${{ inputs.mode }}
    FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
    GEMINI_MODEL: ${{ inputs.gemini-model }}
    MAX_REVIEW_FILES: ${{ inputs.max-review-files }}
    REVIEW_AGENTS: ${{ inputs.agents }}
    USAGE_INGEST_URL: ${{ inputs.usage-report-url }}
    USAGE_INGEST_SHARED_SECRET: ${{ inputs.usage-report-key }}
    FEEDBACK_LOOP_MODE: ${{ inputs.feedback-loop }}
    FEEDBACK_MAX_REPLIES: ${{ inputs.feedback-max-replies }}
    FEEDBACK_MIN_CONFIDENCE: ${{ inputs.feedback-min-confidence }}
